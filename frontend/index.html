<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow Automation Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Top Navbar -->
  <nav class="navbar">
    <div class="navbar-brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="brand-title">Workflow Automation</span>
      <span class="brand-badge">Dashboard</span>
    </div>
    <div class="navbar-actions">
      <div class="navbar-status">
        <span class="status-dot"></span>
        <span>Live</span>
      </div>
      <button class="btn-logout" onclick="handleLogout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Logout
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Page Header -->
    <div class="page-header">
      <div>
        <h1 class="page-title">Overview</h1>
        <p class="page-subtitle">Monitor your workflow statuses and recent activity</p>
      </div>
      <div class="header-refresh">
        <span class="last-updated" id="last-updated">Updating...</span>
        <button class="btn-refresh" onclick="fetchAll()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          Refresh
        </button>
      </div>
    </div>

    <!-- Status Summary Section -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          Status Summary
        </h2>
      </div>
      <div id="status-summary" class="status-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </section>

    <!-- Two-column layout: Chart + Activity -->
    <div class="dashboard-grid">

      <!-- Chart Card -->
      <section class="section card chart-card">
        <div class="section-header card-header-inner">
          <h2 class="section-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"/>
              <line x1="12" y1="20" x2="12" y2="4"/>
              <line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
            Workflow Distribution
          </h2>
        </div>
        <div class="chart-wrapper">
          <canvas id="statusChart"></canvas>
        </div>
        <div class="chart-legend" id="chart-legend"></div>
      </section>

      <!-- Recent Activity Card -->
      <section class="section card activity-card">
        <div class="section-header card-header-inner">
          <h2 class="section-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
            Recent Activity
          </h2>
          <span class="activity-count" id="activity-count"></span>
        </div>
        <ul id="activity-list" class="activity-list">
          <li class="skeleton-item"></li>
          <li class="skeleton-item"></li>
          <li class="skeleton-item"></li>
          <li class="skeleton-item"></li>
        </ul>
      </section>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
